name: Build and Deploy LM Cost App

on:
  push:
    branches:
      - main
    paths:
      - 'apps/lm_cost/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/lm-cost:latest ./apps/lm_cost

      - name: Push Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/lm-cost:latest
