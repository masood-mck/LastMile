name: Build and Deploy LM Cost App

on:
  push:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Image
        run: |
          for attempt in 1 2 3; do
            echo "Docker build attempt ${attempt}/3"
            if docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/lm-cost:latest ./apps/lm_cost; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build failed, retrying after transient registry error..."
              sleep 15
            fi
          done
          exit 1

      - name: Push Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/lm-cost:latest
